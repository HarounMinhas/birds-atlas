name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend-python/requirements-dev.txt
      - run: pip install -r backend-python/requirements-dev.txt
      - run: python -m compileall backend-python
      - run: pytest backend-python
      - run: ruff check backend-python
      - run: ruff format --check backend-python
      - run: mypy backend-python/src

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --prefix frontend --package-lock-only
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-package-lock
          path: frontend/package-lock.json
